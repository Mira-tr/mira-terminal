<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="千景のTRPG Scenario Libraryです。タイトル、作者、タグ、人数、時間から検索できます。">
    <link rel="canonical" href="https://relmua.com/creators/chikage/trpg/scenarios/">
    <meta property="og:title" content="千景 | Scenario Library | RELMUA">
    <meta property="og:description" content="千景のTRPG Scenario Libraryです。タイトル、作者、タグ、人数、時間から検索できます。">
    <meta property="og:image" content="https://relmua.com/assets/creators/chikage/trpg/og-trpg.svg">
    <meta property="og:url" content="https://relmua.com/creators/chikage/trpg/scenarios/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="千景 | Scenario Library | RELMUA">
    <meta name="twitter:description" content="千景のTRPG Scenario Libraryです。タイトル、作者、タグ、人数、時間から検索できます。">
    <meta name="twitter:image" content="https://relmua.com/assets/creators/chikage/trpg/og-trpg.svg">
    <title>千景 | Scenario Library | RELMUA</title>
    <link rel="icon" type="image/svg+xml" href="../../../../assets/brand/relmua-icon.svg">
    <link rel="apple-touch-icon" href="../../../../assets/brand/relmua-icon.svg">
    <link rel="manifest" href="../../../../manifest.webmanifest">
    <script src="../../../../js/theme.js"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/trpg-ui-v3.css">
    <link rel="stylesheet" href="../../css/chikage-house.css">
</head>
<body class="trpg-v3 trpg-library-page cx-scenarios-page">
    <header class="trpg-shell-header">
        <div class="trpg-shell-header__inner">
            <a class="trpg-shell-brand" href="../" aria-label="千景 TRPG Home"><span>千景</span><strong>TRPG</strong></a>
            <nav class="trpg-shell-primary" aria-label="TRPG主要ナビゲーション"><a href="../">Home</a><a href="../scheduler/">卓</a><a href="../calendar/">Calendar</a><a href="./" aria-current="page">Library</a></nav>
            <details class="trpg-shell-menu"><summary>MENU</summary><nav aria-label="TRPGメニュー"><a href="../">Home</a><a href="../scheduler/">卓 / Scheduler</a><a href="../calendar/">Calendar</a><a href="./" aria-current="page">Scenario Library</a><a href="../picker/">Scenario Picker</a><a href="../rules/">House Rules</a><a href="../../">千景</a><a href="../../../../">RELMUA</a></nav></details>
        </div>
    </header>

    <main class="trpg-v3-main cx-scenario-main">
        <section class="trpg-v3-intro" aria-labelledby="libraryTitle">
            <p class="trpg-v3-kicker">TRPG / SCENARIO LIBRARY</p>
            <h1 id="libraryTitle">シナリオを探す。</h1>
            <p>まず名前や作者から。細かい条件は必要な時だけ開けます。</p>
        </section>

        <section class="search-panel cx-library-search" aria-labelledby="searchTitle">
            <div class="section-head">
                <div><p class="section-label">Search</p><h2 id="searchTitle">検索</h2></div>
                <div class="filter-actions"><div class="filter-action-buttons"><button id="shareFilterBtn" class="button button-ghost" type="button" title="検索条件をURLとしてコピーします" disabled>条件URLをコピー</button><button id="resetFilterBtn" class="button button-ghost" type="button" disabled>条件リセット</button></div><p id="shareFilterStatus" class="share-filter-status" aria-live="polite"></p></div>
            </div>

            <div class="filter-grid filter-grid--quick">
                <label class="field"><span>キーワード</span><input id="keywordInput" type="search" placeholder="シナリオ名・タグなど" autocomplete="off"></label>
                <label class="field field-author"><span>作者名</span><input id="authorInput" type="search" placeholder="作者名で検索" autocomplete="off"></label>
            </div>

            <details id="advancedFilters" class="advanced-filters">
                <summary>Filters / Sort</summary>
                <div class="filter-grid">
                    <label class="field"><span>システム</span><select id="systemSelect"><option value="">すべて</option></select></label>
                    <label class="field"><span>人数</span><select id="playersSelect"><option value="">指定なし</option></select></label>
                    <label class="field"><span>時間</span><select id="timeSelect"><option value="">指定なし</option></select></label>
                    <label class="field"><span>年齢区分</span><select id="ratingSelect"><option value="">すべて</option><option value="all">全年齢</option><option value="r18">R18</option></select></label>
                    <label class="field"><span>並び替え</span><select id="sortSelect"><option value="recommended">おすすめ優先</option><option value="title">名前順</option><option value="author">作者順</option><option value="timeAsc">時間が短い順</option><option value="timeDesc">時間が長い順</option><option value="playersAsc">人数が少ない順</option></select></label>
                    <label class="field field-checkbox"><span>お気に入り</span><label class="checkbox-line"><input id="favoriteOnlyInput" type="checkbox"><span>お気に入りのみ</span></label></label>
                </div>
                <div class="tag-filter-area">
                    <div class="tag-filter-head"><span>タグで絞り込む</span><button id="clearTagBtn" class="text-button" type="button" disabled>タグを解除</button></div>
                    <label class="tag-search-field" for="tagSearchInput"><span>タグを検索</span><input id="tagSearchInput" type="search" placeholder="タグ名を入力" autocomplete="off"></label>
                    <div id="selectedTagFilter" class="selected-tag-filter" aria-label="選択中のタグ" hidden></div>
                    <div id="tagFilter" class="tag-filter" aria-label="タグで絞り込み"></div>
                    <div class="tag-filter-footer"><p id="tagFilterStatus" class="tag-filter-status" aria-live="polite"></p><button id="toggleTagListBtn" class="button button-ghost tag-filter-toggle" type="button" aria-controls="tagFilter" aria-expanded="false" hidden>すべてのタグを表示</button></div>
                </div>
            </details>
            <div id="activeFilters" class="active-filters" aria-label="適用中の検索条件" hidden></div>
        </section>

        <section class="result-section cx-library-results" aria-labelledby="resultTitle">
            <h2 id="resultTitle" class="sr-only">見つかったシナリオ</h2>
            <div class="result-toolbar"><p class="section-label result-toolbar__label">Results</p><p id="resultCount" class="result-count" aria-live="polite">0件</p><div class="view-switch" role="group" aria-label="一覧の表示形式"><button id="viewCompactBtn" class="view-switch__btn is-active" type="button" aria-pressed="true"><span class="view-switch__icon" aria-hidden="true">≣</span>一覧</button><button id="viewCardBtn" class="view-switch__btn" type="button" aria-pressed="false"><span class="view-switch__icon" aria-hidden="true">▦</span>カード</button></div></div>
            <div id="scenarioList" class="scenario-list scenario-list--compact"></div>
            <div class="load-more-area"><button id="loadMoreBtn" class="button button-ghost load-more-button" type="button">もっと見る</button></div>
        </section>
    </main>

    <div id="scenarioModal" class="modal" hidden><div class="modal-backdrop" data-modal-close></div><section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><p class="section-label">詳細</p><h2 id="modalTitle">シナリオ詳細</h2></div><button id="modalCloseBtn" class="modal-close-button" type="button">閉じる</button></div><div id="modalBody" class="modal-body"></div></section></div>

    <nav class="trpg-mobile-dock" aria-label="TRPGモバイルナビゲーション"><a href="../">Home</a><a href="../scheduler/">卓</a><a href="./" aria-current="page">Scenarios</a><a href="../rules/">Rules</a><a href="../calendar/">Calendar</a></nav>
    <footer class="trpg-shell-footer"><small>&copy; RELMUA / 千景</small></footer>

    <script type="module" src="../js/shell.js"></script>
    <script type="module" src="../js/app.js"></script>
</body>
</html>
