    <link rel="icon" type="image/svg+xml" href="../../../assets/brand/relmua-icon.svg">
    <link rel="apple-touch-icon" href="../../../assets/brand/relmua-icon.svg">
    <link rel="manifest" href="../../../manifest.webmanifest">

<body class="creator-site-page creator-site-page--chikage chikage-v2"
    data-creators-data-url="../../../data/public-creators.json"
    data-creator-slug="chikage">
    <header class="ch-header">
        <div class="ch-header__inner">
            <div class="ch-logo-link"><a class="site-logo-link" href="../../../" aria-label="Home"><img class="site-logo" src="../../../assets/brand/relmua-logo.svg" alt="RELMUA"></a></div>
            <a class="ch-signature" href="../">千景 <small>House</small></a>
            <nav class="creator-local-nav" aria-label="千景サイト内">
                <a href="../">Home</a>
                <a href="../works/">Works</a>
                <a href="../trpg/">TRPG</a>
                <a href="../profile/">Profile</a>
                <a href="./" aria-current="page">Contact</a>
            </nav>
            <nav class="header-nav" aria-label="RELMUA"><a class="nav-item" href="../../../">RELMUA</a></nav>
            <details class="ch-mobile-menu">
                <summary>MENU</summary>
                <nav aria-label="Mobile Contact menu">
                    <a href="../">Home</a>
                    <a href="../works/">Works</a>
                    <a href="../trpg/">TRPG</a>
                    <a href="../profile/">Profile</a>
                    <a href="./" aria-current="page">Contact</a>
                    <a href="../../../">RELMUA</a>
                </nav>
            </details>
        </div>
    </header>

    <main class="ch-main">
        <section class="ch-page-intro" aria-labelledby="contactTitle">
            <div>
                <p class="ch-eyebrow">CONTACT / CHIKAGE</p>
                <h1 id="contactTitle">連絡する。</h1>
                <p class="ch-lead">公開している窓口だけを掲載しています。RELMUA全体への連絡はブランド側へ。</p>
            </div>
            <div class="ch-page-intro__visual" aria-hidden="true"></div>
        </section>

        <section class="ch-section ch-contact-grid" aria-labelledby="linksTitle">
            <div>
                <p class="ch-eyebrow">PUBLIC LINKS</p>
                <h2 id="linksTitle">千景への連絡。</h2>
            </div>
            <div class="ch-contact-copy">
                <p>現在公開しているリンクを表示します。</p>
                <ul id="creatorLinks" class="profile-link-list" aria-live="polite">
                    <li class="profile-empty-message">公開リンクを読み込んでいます。</li>
                </ul>
                <div class="ch-actions">
                    <a class="ch-button ch-button--quiet" href="../../../contact/">RELMUAの連絡窓口</a>
                </div>
            </div>
        </section>
    </main>

    <footer class="ch-footer"><div class="ch-footer__inner"><small>&copy; RELMUA / 千景</small><a href="../../../">RELMUA</a></div></footer>
    <script type="module" src="../../js/creators.js"></script>
