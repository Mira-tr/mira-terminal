<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RELMUA Admin | 公開チェック</title>
    <link rel="icon" type="image/svg+xml" href="../../../web/assets/brand/relmua-icon.svg">
    <script src="../../js/adminShell.js"></script>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body data-system-page="publish">
    <header class="admin-header">
        <div class="admin-header-inner">
            <div>
                <h1>公開チェック</h1>
                <p>Build & Release Readiness</p>
            </div>
            <nav class="header-nav" aria-label="管理画面のメインメニュー"></nav>
        </div>
    </header>
    <main class="admin-main system-main">
        <nav class="admin-breadcrumb" aria-label="現在位置">
            <ol>
                <li><a href="../../">RELMUA Admin</a></li>
                <li><a href="../">公開・管理</a></li>
                <li aria-current="page">公開チェック</li>
            </ol>
        </nav>
        <section class="panel system-hero" aria-labelledby="systemPublishTitle">
            <div>
                <p class="system-kicker">FINAL CHECK</p>
                <h2 id="systemPublishTitle">公開して大丈夫か確認</h2>
                <p id="systemPublishStatus" class="system-publish-status" role="status">公開条件を確認しています…</p>
            </div>
            <div class="system-control-row">
                <button id="systemPublishPreflight" class="button button-primary" type="button">もう一度チェック</button>
                <button id="copyBuildCommand" class="button button-secondary" type="button">Buildコマンドをコピー</button>
            </div>
        </section>
        <p class="system-status">この画面だけで公開は実行しません。問題がないことを確認してからRepositoryへ反映・mergeします。</p>
        <p id="systemPageStatus" class="system-status" role="status"></p>
        <section class="panel system-section" aria-labelledby="systemBuildManifestTitle">
            <h2 id="systemBuildManifestTitle">Build結果</h2>
            <div id="systemBuildManifest" class="system-grid" aria-live="polite"></div>
        </section>
        <section class="panel system-section" aria-labelledby="systemPublishIssuesTitle">
            <h2 id="systemPublishIssuesTitle">確認が必要なこと</h2>
            <div id="systemPublishIssues" class="system-grid" aria-live="polite"></div>
        </section>
    </main>
    <script type="module" src="../../js/pages/systemPage.js"></script>
</body>
</html>
