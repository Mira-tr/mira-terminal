<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RELMUA 編集室</title>
    <link rel="icon" type="image/svg+xml" href="../web/assets/brand/relmua-icon.svg">
    <script src="./js/adminShell.js"></script>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header class="admin-header">
        <div class="admin-header-inner">
            <div>
                <h1>RELMUA</h1>
                <p>編集ホーム</p>
            </div>
            <nav class="header-nav" aria-label="RELMUA編集メニュー"></nav>
        </div>
    </header>

    <main class="admin-main">
        <nav class="admin-breadcrumb" aria-label="現在位置">
            <ol>
                <li aria-current="page">編集ホーム</li>
            </ol>
        </nav>

        <section class="dashboard panel dashboard-overview" aria-labelledby="dashboardTitle">
            <div class="dashboard-overview-heading">
                <div>
                    <p class="dashboard-kicker">RELMUA EDITOR</p>
                    <h2 id="dashboardTitle">今日は何を編集する？</h2>
                </div>
                <p class="dashboard-overview-note">
                    公開サイトの編集、千景のページ、公開やバックアップまで、やりたいことから選べます。
                </p>
            </div>

            <section class="dashboard-today" aria-labelledby="todayStatusTitle">
                <div class="dashboard-section-heading">
                    <h3 id="todayStatusTitle">いまの状態</h3>
                    <p id="dashboardSystemStatus" class="dashboard-system-status" role="status"></p>
                </div>
                <div id="dashboardTodayList" class="dashboard-today-grid" aria-live="polite"></div>
            </section>

            <section class="dashboard-quick-actions" aria-labelledby="quickActionsTitle">
                <div class="dashboard-section-heading">
                    <h3 id="quickActionsTitle">すぐ始める</h3>
                    <p>よく使う作業へ直接移動します。</p>
                </div>
                <div id="dashboardQuickActions" class="dashboard-quick-grid" aria-live="polite"></div>
            </section>

            <section class="dashboard-recent" aria-labelledby="recentWorkTitle">
                <div class="dashboard-section-heading">
                    <h3 id="recentWorkTitle">最近編集したもの</h3>
                    <a href="./creators/">千景の編集を開く</a>
                </div>
                <div id="dashboardRecentList" class="dashboard-recent-list"></div>
            </section>

            <div class="dashboard-section-heading dashboard-workspaces-heading">
                <h3>編集する場所</h3>
                <p>迷ったら、編集したい対象から選べば大丈夫です。</p>
            </div>

            <div
                id="moduleDashboard"
                class="modules-grid dashboard-overview-grid"
                aria-live="polite"
            ></div>

            <section class="dashboard-backup-summary" aria-labelledby="backupSummaryTitle">
                <div><h3 id="backupSummaryTitle">最後のバックアップ</h3><p id="lastBackupExportAt">まだありません</p></div>
                <div><h3>公開サイト</h3><p>公開前チェックを通してから、本番へ反映します。</p></div>
                <a class="button button-secondary" href="./system/">公開・復旧を管理</a>
            </section>
        </section>
    </main>

    <script type="module" src="./js/pages/adminDashboardPage.js"></script>
</body>
</html>
