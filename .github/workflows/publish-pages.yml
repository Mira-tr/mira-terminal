name: Publish public site to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Run checks
        id: repo-checks
        shell: bash
        run: |
          set +e
          npm run check > check-output.log 2>&1
          status=$?
          cat check-output.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-diagnostics
          path: check-output.log

      - name: Fail if checks failed
        if: steps.repo-checks.outputs.status != '0'
        run: exit 1

      - name: Verify public build
        run: npm run build:public

  publish:
    if: ${{ github.event_name != 'pull_request' }}
    needs: check
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Build public site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build:public

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before deployment retry
        if: ${{ steps.deployment.outcome == 'failure' }}
        run: sleep 45

      - name: Retry GitHub Pages deployment
        if: ${{ steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@v4
