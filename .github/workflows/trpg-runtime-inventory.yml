name: TRPG runtime refactor

on:
  push:
    branches:
      - refactor/trpg-v2-runtime-modules

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Repair refactor generator and architecture tests
        run: |
          python3 <<'PY'
          from pathlib import Path

          generator = Path('scripts/refactor-trpg-v2-runtime-stage2.mjs')
          text = generator.read_text()
          text = text.replace(
              'const braceStart = source.indexOf("{", signatureStart);',
              'const paramsEnd = source.indexOf(")", signatureStart);\n    const braceStart = source.indexOf("{", paramsEnd + 1);'
          )

          if 'write(TEST_PATH, `' in text:
              start = text.index('write(TEST_PATH, `')
              end = text.index('\n\nconsole.log(`Refactored', start)
              replacement = r'''const testSource = String.raw`
          import test from "node:test";
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";

          const ROOT = new URL("../", import.meta.url);
          const APP = "apps/web/creators/chikage/trpg/v2/js/app.js";
          const RUNTIME = "apps/web/creators/chikage/trpg/v2/js/runtime";

          async function read(path){
              return readFile(new URL(path, ROOT), "utf8");
          }

          test("TRPG v2 app is an orchestrator backed by domain runtime modules", async () => {
              const app = await read(APP);
              const bytes = Buffer.byteLength(app);

              for(const moduleName of [
                  "dom.js",
                  "navigation.js",
                  "support.js",
                  "scheduleSupport.js",
                  "availabilityController.js",
                  "preparationActions.js",
                  "schedulerActions.js",
                  "sessionActions.js"
              ]){
                  assert.ok(app.includes("runtime/" + moduleName));
              }

              assert.ok(bytes < 100000, "app.js should stay below 100KB after modularization, got " + bytes);

              for(const moved of [
                  "renderAvailability",
                  "savePreparationItem",
                  "openDetail",
                  "createSession",
                  "answerSlot",
                  "addCandidateBatch",
                  "saveExistingCandidate",
                  "sectionBlock",
                  "readRoute",
                  "normalizeMinuteRange"
              ]){
                  assert.ok(!app.includes("function " + moved + "(") && !app.includes("async function " + moved + "("));
              }
          });

          test("TRPG runtime controllers keep mutation boundaries explicit", async () => {
              const availability = await read(RUNTIME + "/availabilityController.js");
              const preparation = await read(RUNTIME + "/preparationActions.js");
              const scheduler = await read(RUNTIME + "/schedulerActions.js");
              const sessions = await read(RUNTIME + "/sessionActions.js");

              assert.match(availability, /createAvailabilityController/);
              assert.match(preparation, /createPreparationActions/);
              assert.match(scheduler, /createSchedulerActions/);
              assert.match(sessions, /createSessionActions/);

              assert.match(preparation, /createTrpgV12PreparationItem/);
              assert.match(scheduler, /addTrpgV6Candidates/);
              assert.match(sessions, /createTrpgV2Session/);
              assert.match(sessions, /upsertAccountResponse/);
          });
          `;
          write(TEST_PATH, testSource);'''
              text = text[:start] + replacement + text[end:]

          if 'app = `${app.trimEnd()}\\n`;' not in text:
              text = text.replace(
                  'writeFileSync(APP_PATH, app, "utf8");',
                  'app = `${app.trimEnd()}\\n`;\nwriteFileSync(APP_PATH, app, "utf8");'
              )

          generator.write_text(text)

          prep = Path('tests/trpg-v12-preparation.test.mjs')
          text = prep.read_text()
          text = text.replace(
              'const [app, repository, css] = await Promise.all([\n        read("apps/web/creators/chikage/trpg/v2/js/app.js"),\n        read("apps/web/creators/chikage/trpg/scheduler/js/supabaseRepository.js"),',
              'const [app, preparationActions, repository, css] = await Promise.all([\n        read("apps/web/creators/chikage/trpg/v2/js/app.js"),\n        read("apps/web/creators/chikage/trpg/v2/js/runtime/preparationActions.js"),\n        read("apps/web/creators/chikage/trpg/scheduler/js/supabaseRepository.js"),'
          )
          text = text.replace(
              'assert.match(app, /function savePreparationItem/);\n    assert.match(app, /function setPreparationStatus/);\n    assert.match(app, /function reorderPreparation/);',
              'assert.match(preparationActions, /function savePreparationItem/);\n    assert.match(preparationActions, /function setPreparationStatus/);\n    assert.match(preparationActions, /function reorderPreparation/);'
          )
          prep.write_text(text)

          vertical = Path('tests/trpg-v2-vertical-slice.test.mjs')
          text = vertical.read_text()
          text = text.replace(
              'const app = await read("apps/web/creators/chikage/trpg/v2/js/app.js");\n    const repository = await read("apps/web/creators/chikage/trpg/scheduler/js/supabaseRepository.js");\n\n    assert.match(app, /from "\\.\\/recommendationEngine\\.js"/);\n    assert.match(app, /recommendSchedule\\(/);\n    assert.match(app, /confirmTrpgV6RecommendationPlan/);',
              'const [app, schedulerActions, repository] = await Promise.all([\n        read("apps/web/creators/chikage/trpg/v2/js/app.js"),\n        read("apps/web/creators/chikage/trpg/v2/js/runtime/schedulerActions.js"),\n        read("apps/web/creators/chikage/trpg/scheduler/js/supabaseRepository.js")\n    ]);\n\n    assert.match(app, /from "\\.\\/recommendationEngine\\.js"/);\n    assert.match(app, /recommendSchedule\\(/);\n    assert.match(schedulerActions, /confirmTrpgV6RecommendationPlan/);'
          )
          vertical.write_text(text)
          PY

      - name: Apply deterministic modularization
        run: node scripts/refactor-trpg-v2-runtime-stage2.mjs
      - name: Check syntax
        run: node scripts/check-syntax.mjs
      - name: Check public readiness
        run: node scripts/check-public-readiness.mjs
      - name: Run node tests
        run: node --test
      - name: Verify public build
        run: npm run build:public
      - name: Check diff hygiene
        run: git diff --check

      - name: Commit generated refactor
        run: |
          git config user.name "Mira-tr"
          git config user.email "actions@users.noreply.github.com"
          git add \
            scripts/refactor-trpg-v2-runtime-stage2.mjs \
            apps/web/creators/chikage/trpg/v2/js/app.js \
            apps/web/creators/chikage/trpg/v2/js/runtime \
            tests/trpg-runtime-modules.test.mjs \
            tests/trpg-v12-preparation.test.mjs \
            tests/trpg-v2-vertical-slice.test.mjs
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "refactor: split TRPG v2 runtime by domain"
          git push
