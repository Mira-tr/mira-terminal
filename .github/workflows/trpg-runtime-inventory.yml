name: TRPG runtime refactor

on:
  push:
    branches:
      - refactor/trpg-v2-runtime-modules

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Apply deterministic modularization
        run: node scripts/refactor-trpg-v2-runtime-stage2.mjs
      - name: Run checks
        run: npm run check
      - name: Verify public build
        run: npm run build:public
      - name: Check diff hygiene
        run: git diff --check
      - name: Commit generated refactor
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "Mira-tr"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/creators/chikage/trpg/v2/js/app.js \
            apps/web/creators/chikage/trpg/v2/js/runtime \
            tests/trpg-runtime-modules.test.mjs
          git commit -m "refactor: split TRPG v2 runtime by domain"
          git push
